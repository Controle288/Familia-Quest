name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Ensure Tailwind native binary (Linux)
        run: npm install @tailwindcss/oxide-linux-x64-gnu@4.3.3 --no-save
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run lint
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Start preview server
        run: |
          nohup npm run preview -- --port 4173 &
      - name: Wait for preview
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:4173 && break || sleep 1;
          done
      - name: Run E2E tests
        env:
          E2E_URL: http://localhost:4173
          BROWSER: ${{ matrix.browser }}
        run: npm run test:e2e
